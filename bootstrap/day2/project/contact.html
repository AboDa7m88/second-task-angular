<div class="container py-5">
    <h3 class="fw-bold mb-4 text-center">Contact Instructor</h3>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form class="shadow-sm p-4 bg-body-tertiary rounded border">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject</label>
                    <input type="text" class="form-control" placeholder="Message subject">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Course</label>
                    <select class="form-select">
                        <option selected disabled>Choose a course...</option>
                        <option value="1">HTML</option>
                        <option value="2">CSS</option>
                        <option value="3">JavaScript</option>
                        <option value="4">Angular</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Type your message here..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Attachment</label>
                    <input class="form-control" type="file">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit Message</button>
            </form>
        </div>
    </div>
</div>
