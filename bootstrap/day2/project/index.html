<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITI Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="navBar"></div>
    <div id="hero"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-3 col-md-12 mb-4">
                <div id="profile" class="sticky-top" style="top: 20px;"></div>
            </div>
            <div class="col-lg-9 col-md-12">
                <div id="stats"></div>
                <div id="courses"></div>
                <div id="schedule"></div>
                <div id="assignments"></div>
                <div id="grades"></div>
                <div id="announcement"></div>
                <div id="contact"></div>
            </div>
        </div>
    </div>
    
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load(id, file) {
            try {
                const res = await fetch(file);
                const data = await res.text();
                document.getElementById(id).innerHTML = data;
                
                if (id === 'hero') {
                    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
                    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
                }
            } catch (error) {
                console.error('Error loading component:', error);
            }
        }

        load("navBar", "navbar.html");
        load("hero", "hero.html");
        load("profile", "profile.html");
        load("stats", "stats.html");
        load("courses", "courses.html");
        load("schedule", "schedule.html");
        load("assignments", "assignments.html");
        load("grades", "grades.html");
        load("announcement", "announcement.html");
        load("contact", "contact.html");
        load("footer", "footer.html");
    </script>
</body>
</html>
