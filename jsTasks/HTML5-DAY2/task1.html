<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Image Fade</title>

    <style>
        .fade-image {
            width: 300px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .fade-image:hover {
            opacity: 0;
        }
    </style>
</head>

<body>
    <img src="imgs/img.jpg" alt="" class="fade-image">
</body>

</html>
