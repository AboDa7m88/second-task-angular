<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - The Circle</title>

    <style>
        .flipping-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 1px solid red;

            background:
                conic-gradient(from 270deg, green 0deg, blue 180deg, transparent 180deg),
                conic-gradient(from 90deg, red 0deg, yellow 180deg, transparent 180deg);

            animation: flipHalves 5s step-end forwards;
        }

        @keyframes flipHalves {

            0%,
            20%,
            40%,
            60%,
            80% {
                background: conic-gradient(from 90deg, red 0deg, yellow 180deg, transparent 180deg);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                background: conic-gradient(from 270deg, green 0deg, blue 180deg, transparent 180deg);
            }

            100% {
                background:
                    conic-gradient(from 270deg, green 0deg, blue 180deg, transparent 180deg),
                    conic-gradient(from 90deg, red 0deg, yellow 180deg, transparent 180deg);
            }
        }
    </style>
</head>

<body>
    <div class="flipping-circle"></div>
</body>

</html>
